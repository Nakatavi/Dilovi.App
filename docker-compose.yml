services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: condominium
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    ports:
      - "5435:5432"
    volumes:
      - ./environment/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d condominium"]
      interval: 5s
      timeout: 5s
      retries: 10
